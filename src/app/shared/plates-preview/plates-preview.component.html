<section class="plates-preview">
  @if (listings().length) {
    <div class="plates-preview__grid">
      @for (listing of listings(); track listing.plateCharacters) {
        <app-plate-listing-card [listing]="listing" />
      }
    </div>
  } @else if (loaded()) {
    <p class="plates-preview__empty">
      No plates listed for sale just yet — yours could be the first.
    </p>
  }

  <a routerLink="/plates-for-sale" class="plates-preview__all">
    See all plates for sale &rarr;
  </a>
</section>
