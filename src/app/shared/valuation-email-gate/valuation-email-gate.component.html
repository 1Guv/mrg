<mat-card class="gate-card mx-auto my-2 p-3">
  <div class="range bg-warning rounded-3 p-3 text-center">
    <span class="cabin-font-heading d-block">Typical range</span>
    <span class="cabin-font-text">£{{ minPrice | number: '1.0-0' }} – £{{ maxPrice | number: '1.0-0' }}</span>
  </div>

  <div class="locked-value text-center my-3">
    <span class="locked-label">Your exact valuation</span>
    <span class="locked-figure-row">
      <span class="locked-figure" aria-hidden="true">£{{ lockedFigure }}</span>
      <span class="lock-icon" aria-hidden="true">🔒</span>
    </span>
  </div>

  <button mat-stroked-button type="button" class="google-btn" [disabled]="sending()" (click)="continueWithGoogle()">
    <svg class="google-logo" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/>
      <path fill="#FBBC05" d="M10.6 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.8l7.9-6.1z"/>
      <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/>
    </svg>
    Continue with Google
  </button>

  <div class="or-divider my-2" aria-hidden="true">or</div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="d-flex flex-column">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Your email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email">
    </mat-form-field>

    @if (errorMessage()) {
      <p class="text-danger small mt-2 mb-0">{{ errorMessage() }}</p>
    }

    <button mat-raised-button color="primary" type="submit" class="submit-btn mt-2" [disabled]="form.invalid || sending()">
      @if (sending()) {
        <mat-spinner diameter="20" />
      } @else {
        Show my exact value
      }
    </button>
    <p class="hint text-center mt-2 mb-1">Shown here instantly and emailed to you · no spam</p>

    <mat-checkbox formControlName="marketingConsent" class="consent">
      Send me tips &amp; offers, and show me relevant ads
    </mat-checkbox>
  </form>

  <app-stats-strip class="mt-2" [compact]="true" />
</mat-card>
